<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Documentação por Cargo (Dados Originais)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: #0f172a;
      color: #fff;
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .header-title h1 { font-size: 1.25rem; font-weight: 700; }
    .header-title p { font-size: 0.82rem; color: #94a3b8; }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.2); }
    .btn-outline:hover { background: rgba(255,255,255,0.16); }
    .btn-danger-outline { background: transparent; color: #fca5a5; border-color: rgba(252,165,165,0.35); }
    .btn-danger-outline:hover { background: rgba(220,38,38,0.2); }

    .container {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 20px 50px;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
    .stat-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .stat-danger .stat-value { color: var(--danger); }
    .stat-success .stat-value { color: var(--success); }

    /* Search & Filter Bar */
    .search-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .search-bar input {
      flex: 2;
      min-width: 240px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-bar select {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.92rem;
      background: #fff;
    }
    .search-bar input:focus, .search-bar select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2,132,199,0.12);
    }

    /* Cargos Tabs Navigation */
    .cargos-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }
    .cargo-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.15s;
    }
    .cargo-tab:hover { border-color: var(--primary); color: var(--primary); }
    .cargo-tab.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    .cargo-tab span {
      background: rgba(0,0,0,0.08);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.74rem;
      margin-left: 5px;
    }
    .cargo-tab.active span { background: rgba(255,255,255,0.22); color: #fff; }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .section-title { font-size: 1.2rem; font-weight: 800; color: #0f172a; }
    .section-count { font-size: 0.88rem; color: var(--muted); font-weight: 600; }

    /* Employee List */
    .employee-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .emp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }
    .emp-card.has-pendency { border-left-color: var(--danger); }
    .emp-card.all-ok { border-left-color: var(--success); }

    .emp-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .emp-name { font-size: 1.05rem; font-weight: 700; color: #0f172a; }
    .badge-status {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .badge-status.pendente { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
    .badge-status.aprovado { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }

    .btn-complete-all {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
      padding: 5px 10px;
      font-size: 0.76rem;
    }
    .btn-complete-all:hover { background: #dcfce7; }

    /* Docs Grid */
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 8px;
    }
    .doc-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .doc-item.doc-pendente {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: #991b1b;
    }
    .doc-item.doc-pendente:hover { background: #fee2e2; }
    .doc-item.doc-ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #166534;
    }
    .doc-item.doc-ok:hover { background: #dcfce7; }
    .doc-item.doc-na {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #94a3b8;
      cursor: default;
    }

    .doc-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .doc-left input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }
    .doc-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .doc-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .tag-pend { background: #fecaca; color: #991b1b; }
    .tag-ok { background: #bbf7d0; color: #166534; }
    .tag-na { background: #e2e8f0; color: #64748b; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.86rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

let employees = [];
let currentCargo = CARGOS[0];

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      employees = JSON.parse(saved);
      return;
    } catch(e) {}
  }
  employees = RAW_ROWS.map(r => ({
    id: r[0],
    nome: r[1],
    cargo: CARGOS[r[2]],
    docs: [...r[3]]
  }));
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(employees));
}

function initUI() {
  const nav = document.getElementById("cargosNav");
  nav.innerHTML = CARGOS.map(c => {
    const empsCargo = employees.filter(e => e.cargo === c);
    const pendEmps = empsCargo.filter(e => e.docs.includes(2)).length;
    return `<button class="cargo-tab ${c === currentCargo ? 'active' : ''}" onclick="selectCargo('${c}')">${c} <span>${empsCargo.length} (${pendEmps} pend.)</span></button>`;
  }).join("");
}

function selectCargo(cargo) {
  currentCargo = cargo;
  document.getElementById("searchInput").value = "";
  initUI();
  renderList();
}

function toggleDoc(empId, docIndex) {
  const emp = employees.find(e => e.id === empId);
  if (!emp) return;
  const current = emp.docs[docIndex];
  if (current === 3) return;

  emp.docs[docIndex] = current === 2 ? 1 : 2;
  saveState();
  initUI();
  renderStats();
  renderList();
  showToast(`Documento atualizado para ${emp.nome}`);
}

function completeAllPending(empId) {
  const emp = employees.find(e => e.id === empId);
  if (!emp) return;
  let changed = 0;
  emp.docs = emp.docs.map(st => {
    if (st === 2) { changed++; return 1; }
    return st;
  });
  if (changed > 0) {
    saveState();
    initUI();
    renderStats();
    renderList();
    showToast(`Todas as pendências de ${emp.nome} foram entregues!`);
  }
}

function renderStats() {
  let totalEmp = employees.length;
  let empComPendencia = 0;
  let totalDocsPendentes = 0;

  employees.forEach(e => {
    if (e.docs.includes(2)) empComPendencia++;
    e.docs.forEach(d => { if (d === 2) totalDocsPendentes++; });
  });

  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total de Funcionários</div>
      <div class="stat-value">${totalEmp}</div>
      <div class="stat-sub">100% extraídos da planilha</div>
    </div>
    <div class="stat-card stat-danger">
      <div class="stat-label">Funcionários com Pendência</div>
      <div class="stat-value">${empComPendencia}</div>
      <div class="stat-sub">De ${totalEmp} colaboradores</div>
    </div>
    <div class="stat-card stat-danger">
      <div class="stat-label">Documentos Pendentes</div>
      <div class="stat-value">${totalDocsPendentes}</div>
      <div class="stat-sub">Itens faltantes no total</div>
    </div>
    <div class="stat-card stat-success">
      <div class="stat-label">Documentação Completa</div>
      <div class="stat-value">${totalEmp - empComPendencia}</div>
      <div class="stat-sub">Sem nenhuma pendência</div>
    </div>
  `;
}

function renderList() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const statusFilter = document.getElementById("statusFilter").value;

  let list = employees;
  if (query) {
    list = employees.filter(e => e.nome.toLowerCase().includes(query));
    document.getElementById("sectionTitle").textContent = `Busca Global: "${query.toUpperCase()}"`;
  } else {
    list = employees.filter(e => e.cargo === currentCargo);
    document.getElementById("sectionTitle").textContent = `Cargo: ${currentCargo}`;
  }

  if (statusFilter === "PENDENTES") {
    list = list.filter(e => e.docs.includes(2));
  } else if (statusFilter === "ENTREGUES") {
    list = list.filter(e => !e.docs.includes(2));
  }

  document.getElementById("sectionCount").textContent = `${list.length} funcionário(s) exibido(s)`;

  const listEl = document.getElementById("employeeList");
  if (list.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;padding:40px;color:#64748b;background:#fff;border-radius:10px;border:1px solid var(--border);">Nenhum funcionário encontrado neste filtro.</div>`;
    return;
  }

  listEl.innerHTML = list.map(emp => {
    const pendCount = emp.docs.filter(d => d === 2).length;
    const cardClass = pendCount > 0 ? "has-pendency" : "all-ok";
    const badge = pendCount > 0
      ? `<span class="badge-status pendente">${pendCount} PENDENTE${pendCount > 1 ? 'S' : ''}</span>`
      : `<span class="badge-status aprovado">TUDO ENTREGUE / OK</span>`;

    const docsHtml = emp.docs.map((val, idx) => {
      let cls = "doc-ok";
      let tag = `<span class="doc-tag tag-ok">ENTREGUE</span>`;
      let checked = "checked";
      let disabled = "";

      if (val === 2) {
        cls = "doc-pendente";
        tag = `<span class="doc-tag tag-pend">PENDENTE</span>`;
        checked = "";
      } else if (val === 3) {
        cls = "doc-na";
        tag = `<span class="doc-tag tag-na">N/A</span>`;
        checked = "";
        disabled = "disabled";
      }

      const clickAttr = val === 3 ? "" : `onclick="toggleDoc(${emp.id}, ${idx})"`;

      return `
        <div class="doc-item ${cls}" ${clickAttr}>
          <div class="doc-left">
            <input type="checkbox" ${checked} ${disabled} onclick="event.stopPropagation(); toggleDoc(${emp.id}, ${idx})" />
            <span class="doc-name">${DOC_DEFS[idx].label}</span>
          </div>
          ${tag}
        </div>
      `;
    }).join("");

    return `
      <div class="emp-card ${cardClass}">
        <div class="emp-header">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="emp-name">${emp.nome}</span>
            <span style="font-size:0.75rem;background:#e2e8f0;padding:2px 8px;border-radius:4px;font-weight:700;color:#334155;">${emp.cargo}</span>
            ${badge}
          </div>
          <div>
            ${pendCount > 0 ? `<button class="btn-complete-all" onclick="completeAllPending(${emp.id})">✓ Entregar todas as pendências</button>` : ""}
          </div>
        </div>
        <div class="docs-grid">${docsHtml}</div>
      </div>
    `;
  }).join("");
}

function exportCSV() {
  const statusText = ["", "Ok/Entregue", "Pendente", "Não se aplica"];
  const headers = ["NOME", "CARGO", ...DOC_DEFS.map(d => d.label)];
  const rows = [headers.join(";")];

  employees.forEach(emp => {
    const line = [
      `"${emp.nome}"`,
      `"${emp.cargo}"`,
      ...emp.docs.map(d => `"${statusText[d]}"`)
    ];
    rows.push(line.join(";"));
  });

  const blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `documentos_por_cargo_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("Planilha CSV exportada com sucesso!");
}

function resetData() {
  if (!confirm("Deseja restaurar todos os dados originais da planilha?")) return;
  localStorage.removeItem(STORAGE_KEY);
  loadState();
  initUI();
  renderStats();
  renderList();
  showToast("Dados originais restaurados.");
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

loadState();
initUI();
renderStats();
renderList();
</script>
</body>
</html>
